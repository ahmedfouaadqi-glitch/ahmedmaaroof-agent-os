services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ahmed-maarof-agent-os-api:local
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/agent_os.sqlite3
      VAULT_PATH: /app/Vault
      DESIGNER_OUTPUT_DIR: /app/data/designer
      AUTOMATION_WORKER_ENABLED: ${AUTOMATION_WORKER_ENABLED:-false}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - agent_data:/app/data
      - ./backend/Vault:/app/Vault:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  agent_data:
